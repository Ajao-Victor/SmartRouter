<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SmartRouter">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#19e6c1"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#a08cff"/>
      <stop offset="0.55" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#19e6c1"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#05060a"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>
  <!-- routes: three paths fanning out of the orb to provider nodes -->
  <g fill="none" stroke="url(#beam)" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <path d="M256 256 C 300 200, 340 180, 392 150"/>
    <path d="M256 256 C 330 256, 360 256, 400 256"/>
    <path d="M256 256 C 300 312, 340 332, 392 362"/>
  </g>
  <g fill="#19e6c1">
    <circle cx="400" cy="146" r="18"/>
    <circle cx="408" cy="256" r="18"/>
    <circle cx="400" cy="366" r="18"/>
  </g>
  <!-- the router orb -->
  <circle cx="232" cy="256" r="104" fill="url(#orb)"/>
  <circle cx="200" cy="222" r="34" fill="#ffffff" fill-opacity="0.35"/>
</svg>
